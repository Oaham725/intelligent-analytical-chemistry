<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="t17 d17">
<title id="t17">第17章基础知识图解：慢科学环与快控制环</title>
<desc id="d17">外环由信念状态、策略和奖励核验组成，提出技能级动作；屏蔽器检查硬约束；内环由技能状态机、执行器和样品仪器组成，通过传感器反馈核验后置条件；不可恢复的异常进入安全态并由人工接管。</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#345a8a"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e7a52"/></marker>
</defs>
<style>
  .f{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
  .h{font-size:30px;font-weight:700;fill:#18324b}
  .band{font-size:22px;font-weight:700}
  .nt{font-size:24px;font-weight:700;fill:#18324b;text-anchor:middle}
  .ns{font-size:19px;fill:#34536d;text-anchor:middle}
  .lab{font-size:19px;fill:#345a8a}
  .labR{font-size:19px;fill:#c0392b}
  .labG{font-size:19px;fill:#1e7a52}
  .e{stroke:#345a8a;stroke-width:3.5;fill:none}
  .eR{stroke:#c0392b;stroke-width:3;fill:none;stroke-dasharray:10 7}
  .eG{stroke:#1e7a52;stroke-width:3.5;fill:none}
  .node{fill:#ffffff;stroke:#345a8a;stroke-width:3}
  .nodeG{fill:#ffffff;stroke:#1e7a52;stroke-width:3}
</style>
<rect width="1600" height="1040" fill="#ffffff"/>
<text class="f h" x="60" y="52">第17章 基础知识图解：慢科学环 × 屏蔽器 × 快控制环</text>

<!-- 外环 -->
<text class="f band" x="60" y="88" fill="#345a8a">外环｜慢科学环（分钟—小时）：决定“下一步做什么”</text>
<rect x="60" y="100" width="1480" height="260" rx="24" fill="#eef4fa" stroke="#9db7d3" stroke-width="2"/>
<rect class="node" x="90" y="180" width="300" height="150" rx="18"/>
<text class="f nt" x="240" y="228">信念状态 bₜ</text>
<text class="f ns" x="240" y="262">对样品与仪器状态的</text>
<text class="f ns" x="240" y="288">概率估计（不是真实 sₜ）</text>
<rect class="node" x="470" y="180" width="300" height="150" rx="18"/>
<text class="f nt" x="620" y="228">策略 π(a | bₜ)</text>
<text class="f ns" x="620" y="262">提出技能级动作 aₜ</text>
<text class="f ns" x="620" y="288">例：“向 B3 孔加 50 µL”</text>
<rect class="nodeG" x="1170" y="180" width="300" height="150" rx="18"/>
<text class="f nt" x="1320" y="228">奖励 rₜ 与独立核验</text>
<text class="f ns" x="1320" y="262">rₜ = 分析质量 − 成本</text>
<text class="f ns" x="1320" y="288">真值来自质控样/参比方法</text>
<text class="f ns" x="975" y="240">第5章贝叶斯优化 = 外环每轮</text>
<text class="f ns" x="975" y="266">只选一次条件、样品状态被重置</text>
<path class="e" d="M390 255H462" marker-end="url(#arr)"/>
<path class="eG" d="M1320 180V140H240V172" marker-end="url(#arrG)"/>
<text class="f labG" x="560" y="130">更新信念与模型：bₜ₊₁ ← (bₜ, aₜ, oₜ₊₁, rₜ)</text>

<!-- 中间层：屏蔽器与人工 -->
<rect x="420" y="450" width="400" height="100" rx="14" fill="#fff4e5" stroke="#d9822b" stroke-width="3"/>
<text class="f nt" x="620" y="490" fill="#8a4b0f">屏蔽器：执行前检查 g(s,a) ≤ 0</text>
<text class="f ns" x="620" y="524">违反硬约束 → 替换为安全动作 a′ₜ</text>
<text class="f ns" x="1040" y="490">只管“能不能做”（溢出、超温、未校准）</text>
<text class="f ns" x="1040" y="518">不管“值不值得做”（那是奖励的事）</text>
<path class="e" d="M620 330V442" marker-end="url(#arr)"/>
<text class="f lab" x="636" y="400">aₜ</text>
<rect x="90" y="450" width="300" height="100" rx="14" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text class="f nt" x="240" y="492" fill="#7b241c">人工接管</text>
<text class="f ns" x="240" y="524">批准目标·处理不可恢复故障</text>
<path class="eR" d="M240 450V338" marker-end="url(#arrR)"/>
<text class="f labR" x="252" y="400">停止外环 / 修改约束</text>

<!-- 内环 -->
<rect x="60" y="600" width="1480" height="320" rx="24" fill="#eef8f2" stroke="#9fcfb6" stroke-width="2"/>
<rect x="90" y="650" width="300" height="150" rx="18" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text class="f nt" x="240" y="700" fill="#7b241c">安全态</text>
<text class="f ns" x="240" y="734">关泵·关阀·停加热</text>
<text class="f ns" x="240" y="760">保存数据·报警</text>
<rect class="node" x="470" y="650" width="300" height="150" rx="18"/>
<text class="f nt" x="620" y="700">技能状态机 / 行为树</text>
<text class="f ns" x="620" y="734">前置条件 → 执行 → 后置条件</text>
<text class="f ns" x="620" y="760">超时 · 幂等重试 · 有限次数</text>
<rect class="node" x="820" y="650" width="300" height="150" rx="18"/>
<text class="f nt" x="970" y="700">执行器</text>
<text class="f ns" x="970" y="734">泵 · 阀 · 移液 · 温控</text>
<text class="f ns" x="970" y="760">（带编号的命令）</text>
<rect x="1170" y="650" width="300" height="150" rx="18" fill="#f4f4f4" stroke="#5d6d7e" stroke-width="3" stroke-dasharray="4 4"/>
<text class="f nt" x="1320" y="700">样品与仪器 sₜ</text>
<text class="f ns" x="1320" y="734">真实状态：浓度、显色进度、</text>
<text class="f ns" x="1320" y="760">体积、灯源漂移（不可直接看到）</text>
<path class="e" d="M620 550V642" marker-end="url(#arr)"/>
<text class="f lab" x="636" y="588">a′ₜ（技能请求）</text>
<path class="e" d="M770 725H812" marker-end="url(#arr)"/>
<path class="e" d="M1120 725H1162" marker-end="url(#arr)"/>
<path class="eG" d="M1320 800V880H620V808" marker-end="url(#arrG)"/>
<text class="f labG" x="700" y="908">传感器反馈 y：体积 · 液位 · 温度 · 应答（用于核验后置条件，毫秒—秒）</text>
<path class="eG" d="M1320 650V338" marker-end="url(#arrG)"/>
<text class="f labG" x="1150" y="440">观测 oₜ₊₁</text>
<text class="f labG" x="1150" y="466">（光谱读数）</text>
<path class="eR" d="M470 725H398" marker-end="url(#arrR)"/>
<text class="f labR" x="400" y="640">不可恢复</text>
<path class="eR" d="M240 650V558" marker-end="url(#arrR)"/>
<text class="f band" x="60" y="955" fill="#1e7a52">内环｜快控制环（毫秒—秒）：保证“动作被正确执行”，但不能证明“化学结论正确”</text>

<text class="f ns" x="60" y="1005" style="text-anchor:start">图例：蓝色实线＝命令流；绿色实线＝测量/反馈流；红色虚线＝异常与人工路径；橙色＝硬约束。系统只能看到观测 o 与反馈 y，看不到真实状态 s。</text>
</svg>
