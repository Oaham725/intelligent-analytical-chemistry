<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><defs><style>.t{font-family:'Noto Sans CJK SC','PingFang SC',sans-serif;fill:#19263a}.h{font-size:34px;font-weight:700}.n{font-size:23px;font-weight:650}.s{font-size:18px}.b{fill:#f8fbfa;stroke:#2f6b5d;stroke-width:2}.a{stroke:#2f6b5d;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0V6L9 3z" fill="#2f6b5d"/></marker></defs><rect width="1200" height="740" fill="white"/><text x="55" y="62" class="t h">第5章　实验设计：以最少实验区分最多解释</text><g class="t">
<rect x="65" y="120" width="235" height="135" rx="14" class="b"/><text x="182" y="160" text-anchor="middle" class="n">定义设计空间</text><text x="182" y="197" text-anchor="middle" class="s">因素、响应、约束</text><text x="182" y="225" text-anchor="middle" class="s">筛选/建模/优化</text>
<rect x="365" y="120" width="235" height="135" rx="14" class="b"/><text x="482" y="160" text-anchor="middle" class="n">经典初始设计</text><text x="482" y="197" text-anchor="middle" class="s">随机化、重复、区组</text><text x="482" y="225" text-anchor="middle" class="s">析因/正交/响应面</text>
<rect x="665" y="120" width="235" height="135" rx="14" class="b"/><text x="782" y="160" text-anchor="middle" class="n">代理与不确定度</text><text x="782" y="197" text-anchor="middle" class="s">贝叶斯更新</text><text x="782" y="225" text-anchor="middle" class="s">高斯过程均值＋方差</text>
<rect x="965" y="120" width="180" height="135" rx="14" class="b"/><text x="1055" y="160" text-anchor="middle" class="n">选择新实验</text><text x="1055" y="197" text-anchor="middle" class="s">EI / UCB</text><text x="1055" y="225" text-anchor="middle" class="s">安全与成本</text>
<rect x="665" y="365" width="235" height="145" rx="14" class="b"/><text x="782" y="405" text-anchor="middle" class="n">更新与停止</text><text x="782" y="442" text-anchor="middle" class="s">新观测进入后验</text><text x="782" y="472" text-anchor="middle" class="s">改进/不确定度/预算</text>
<rect x="965" y="365" width="180" height="145" rx="14" class="b"/><text x="1055" y="405" text-anchor="middle" class="n">确认实验</text><text x="1055" y="442" text-anchor="middle" class="s">独立重复</text><text x="1055" y="472" text-anchor="middle" class="s">邻域稳健性</text>
<path d="M300 187H365M600 187H665M900 187H965M1055 255V365M965 437H900" class="a"/><path d="M782 365V310H482V255" class="a"/>
<text x="65" y="640" class="n">边界：</text><text x="145" y="640" class="s">优化能找到高响应条件，但因果解释仍依赖随机化、对照和可估计的误差结构。</text></g></svg>
