<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs><style>.t{font-family:'Noto Sans CJK SC','PingFang SC',sans-serif;fill:#172033}.h{font-size:34px;font-weight:700}.n{font-size:24px;font-weight:650}.s{font-size:19px}.b{fill:#f7fafc;stroke:#315b7d;stroke-width:2}.a{stroke:#315b7d;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/><text x="60" y="65" class="t h">第2章　化学数据：数值必须保留测量语境</text>
<rect x="55" y="120" width="250" height="150" rx="16" class="b"/><text x="180" y="160" text-anchor="middle" class="t n">原始测量对象</text><text x="180" y="198" text-anchor="middle" class="t s">强度＋坐标轴</text><text x="180" y="230" text-anchor="middle" class="t s">样品身份＋元数据</text>
<rect x="365" y="120" width="250" height="150" rx="16" class="b"/><text x="490" y="160" text-anchor="middle" class="t n">质量审计</text><text x="490" y="198" text-anchor="middle" class="t s">缺失、饱和、坏点</text><text x="490" y="230" text-anchor="middle" class="t s">重复与误差层级</text>
<rect x="675" y="120" width="250" height="150" rx="16" class="b"/><text x="800" y="160" text-anchor="middle" class="t n">任务化划分</text><text x="800" y="198" text-anchor="middle" class="t s">样品/批次/时间/仪器</text><text x="800" y="230" text-anchor="middle" class="t s">训练、验证、测试</text>
<rect x="365" y="360" width="250" height="170" rx="16" class="b"/><text x="490" y="400" text-anchor="middle" class="t n">机制化预处理</text><text x="490" y="438" text-anchor="middle" class="t s">基线、对齐、SNV/MSC</text><text x="490" y="470" text-anchor="middle" class="t s">平滑与导数</text><text x="490" y="502" text-anchor="middle" class="t s">只在训练折拟合</text>
<rect x="675" y="360" width="250" height="170" rx="16" class="b"/><text x="800" y="400" text-anchor="middle" class="t n">诊断与矩阵输出</text><text x="800" y="438" text-anchor="middle" class="t s">原始图、残差图、批次图</text><text x="800" y="470" text-anchor="middle" class="t s">X / y / groups</text><text x="800" y="502" text-anchor="middle" class="t s">处理参数与质量标记</text>
<path d="M305 195H365M615 195H675M800 270V360M675 445H615" class="a"/><path d="M490 360V300H180V270" class="a"/>
<text x="60" y="635" class="t n">判据：</text><text x="150" y="635" class="t s">每一步都应回答“删除了哪种变化、保留了哪种化学信息、参数由哪部分数据估计”。</text>
</svg>
