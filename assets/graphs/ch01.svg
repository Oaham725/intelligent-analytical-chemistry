<text class="ct" x="800" y="540">智能测量</text>
<rect class="node" x="595.0" y="102.0" width="410" height="136" rx="20"/>
<text class="t" x="800.0" y="153.0">1.1 分析化学的核心任务：是什么</text>
<text class="t" x="800.0" y="187.0">、多少、在哪里与如何变化</text>
<rect class="node" x="1080.0" y="277.0" width="410" height="136" rx="20"/>
