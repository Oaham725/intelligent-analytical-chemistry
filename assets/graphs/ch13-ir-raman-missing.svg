<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title">
<title id="title">缺失模态的预测路径</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#45677a"/></marker></defs>
<rect width="1000" height="470" rx="18" fill="#f0f6f6"/>
<g font-family="Microsoft YaHei, sans-serif" text-anchor="middle" fill="#173449">
<text x="500" y="43" font-size="25" font-weight="bold">缺失模态的预测路径</text>
<rect x="224" y="68" width="552" height="59" rx="10" fill="#d0eeea"/>
<text x="500" y="104" font-size="21">同一对象：先检查质量与当前可用模态</text>
<path d="M500 127V152M173 177V152H827V177M500 152V177" stroke="#45677a" stroke-width="2" fill="none"/>
<rect x="25" y="177" width="296" height="108" rx="10" fill="#d0eeea"/><text x="173" y="210" font-size="21" font-weight="bold">两种均可靠</text><text x="173" y="239" font-size="17">核对同一对象</text><text x="173" y="264" font-size="17">使用已验证的双模态路径</text><path d="M173 285v38" stroke="#45677a" stroke-width="2" marker-end="url(#arrow)"/><rect x="352" y="177" width="296" height="108" rx="10" fill="#d0eeea"/><text x="500" y="210" font-size="21" font-weight="bold">仅一种可靠</text><text x="500" y="239" font-size="17">检查该模态适用域</text><text x="500" y="264" font-size="17">使用已验证的单模态回退</text><path d="M500 285v38" stroke="#45677a" stroke-width="2" marker-end="url(#arrow)"/><rect x="679" y="177" width="296" height="108" rx="10" fill="#f9e6cc"/><text x="827" y="210" font-size="21" font-weight="bold">没有可靠模态</text><text x="827" y="239" font-size="17">记录不可用原因</text><text x="827" y="264" font-size="17">暂缓并评估补测</text><path d="M827 285v38" stroke="#45677a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="329" width="950" height="61" rx="10" fill="#fff"/>
<text x="500" y="365" font-size="20">配对未确认、超适用域或证据不足时，暂缓判断并按需要补测</text>
<text x="500" y="431" font-size="17">按可用组合记录所用模态、缺失原因、误差与覆盖率</text>
</g></svg>
